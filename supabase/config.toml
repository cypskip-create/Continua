# NOTE: no [functions.hello] entry — that was leftover config referencing
# the dashboard's "Simple Hello World" starter template, which was never
# actually created as a real function under supabase/functions/. Deploying
# it failed with "Entrypoint path does not exist" until this was removed.

[functions.ai-stock-analysis]
entrypoint = './functions/ai-stock-analysis/index.js'
# false, not true: this function already validates the caller's JWT itself
# (see index.js — Authorization header -> supabase-js auth check)
# and returns its own CORS headers for OPTIONS. With verify_jwt=true, the
# Supabase gateway checks the JWT BEFORE the function code runs at all —
# and a browser's CORS preflight (OPTIONS) never carries an Authorization
# header, so the gateway rejected the preflight itself with a non-2xx
# status, before this function's own corsHeaders/OPTIONS handling ever ran.
# That's a plain CORS failure in the browser, not an auth downgrade here:
# the manual check inside the function still enforces the same auth.
verify_jwt = false

[functions.stock-thesis]
entrypoint = './functions/stock-thesis/index.js'
# Same reasoning as ai-stock-analysis above.
verify_jwt = false

[functions.check-price-alerts]
entrypoint = './functions/check-price-alerts/index.js'
# Same reasoning as ai-stock-analysis above.
verify_jwt = false

[functions.check-indicator-alerts]
entrypoint = './functions/check-indicator-alerts/index.js'
# Same reasoning as ai-stock-analysis above.
verify_jwt = false

[functions.run-price-alerts]
entrypoint = './functions/run-price-alerts/index.js'
# Invoked on a schedule by pg_cron/pg_net (see migration
# …_schedule_alert_sweeps.sql), not by a signed-in browser session — there
# is no user JWT to verify. It's gated on its own shared secret
# (ALERTS_CRON_SECRET) instead; see the function for details.
verify_jwt = false

[functions.delete-account]
entrypoint = './functions/delete-account/index.js'
# Same reasoning as ai-stock-analysis above.
verify_jwt = false

[functions.upgrade-subscription]
entrypoint = './functions/upgrade-subscription/index.js'
# Same reasoning as ai-stock-analysis above.
verify_jwt = false

[auth]
enable_signup = true
