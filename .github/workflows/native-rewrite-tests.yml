name: Native rewrite candidate tests (not production cutover)
on:
  push:
    branches: [main]
    paths:
      - 'backend-go/**'
      - 'backend/src/**'
      - 'backend/package-lock.json'
      - 'backend/python/**'
      - 'engine-python/**'
      - 'scraper-python/**'
      - 'infra/migration/native-*.mjs'
      - 'infra/migration/native-*.py'
      - 'infra/migration/canonical-financial-fixture.mjs'
      - 'infra/migration/investment-evidence-fixture.mjs'
      - 'infra/migration/institutional-fixture.mjs'
      - 'infra/cloudflare/**'
      - 'infra/security/**'
      - 'supabase/migrations/**'
      - '.github/workflows/native-rewrite-tests.yml'
  pull_request:
    paths:
      - 'backend-go/**'
      - 'backend/src/**'
      - 'backend/package-lock.json'
      - 'backend/python/**'
      - 'engine-python/**'
      - 'scraper-python/**'
      - 'infra/migration/native-*.mjs'
      - 'infra/migration/native-*.py'
      - 'infra/migration/canonical-financial-fixture.mjs'
      - 'infra/migration/investment-evidence-fixture.mjs'
      - 'infra/migration/institutional-fixture.mjs'
      - 'infra/cloudflare/**'
      - 'infra/security/**'
      - 'supabase/migrations/**'
      - '.github/workflows/native-rewrite-tests.yml'
permissions:
  contents: read
jobs:
  candidate-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      native-postgres:
        image: postgres@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_PASSWORD: continua-fixture-only
          POSTGRES_DB: continua_native_fixture
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --user 70:70 --read-only --cap-drop ALL
          --security-opt no-new-privileges
          --memory 256m --memory-swap 256m --cpus 1 --pids-limit 128
          --tmpfs /tmp:rw,nosuid,noexec,size=16m
          --tmpfs /var/run/postgresql:rw,nosuid,noexec,size=4m,uid=70,gid=70
          --tmpfs /var/lib/postgresql/data:rw,nosuid,noexec,size=128m,uid=70,gid=70,mode=0700
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d continua_native_fixture"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NATIVE_PYTHON_BIN: python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scraper/scripts/testRenderLight.mjs
      - run: go -C backend-go mod verify
      - run: go -C backend-go test ./...
      - run: go -C backend-go test -race ./...
      - name: Real disposable PostgreSQL migration, authentication and atomicity fixture
        run: go -C backend-go test ./internal/marketdata -run '^TestPostgresOwnedFixtureMigrationAndAtomicQuoteOutbox$' -count=1 -v
        env:
          NATIVE_POSTGRES_FIXTURE_URL: postgresql://postgres:continua-fixture-only@127.0.0.1:5432/continua_native_fixture?sslmode=disable&application_name=continua-native-fixture
      - name: Restore a real disposable database backup
        run: node infra/security/restore-fixture.mjs
        env:
          CONTINUA_DISPOSABLE_FIXTURE: 'true'
          NATIVE_POSTGRES_CONTAINER: ${{ job.services.native-postgres.id }}
      - run: go -C backend-go vet ./...
      - run: python -m pip install -r backend/python/requirements.txt
      - run: python -m unittest discover -s engine-python/tests -v
      - run: python -m pip install -r scraper-python/requirements-lock.txt
      - run: python -m pip check
      - name: Collector PostgreSQL lease, recovery and artifact persistence fixture
        run: python -m unittest discover -s scraper-python/tests -p 'test_postgres_collector.py' -v
        env:
          NATIVE_COLLECTOR_POSTGRES_FIXTURE_URL: postgresql://postgres:continua-fixture-only@127.0.0.1:5432/continua_native_fixture?sslmode=disable&application_name=continua-native-fixture
      - run: python -m unittest discover -s scraper-python/tests -v
      - run: node --test infra/cloudflare/*.test.mjs
      - run: npm ci --prefix backend
      - run: npm ci --prefix scraper
      - run: npm --prefix scraper test -- --run tests/storage/storagePolicy.test.ts tests/storage/r2Storage.test.ts tests/storage/r2Archive.test.ts tests/storage/sourceCompression.test.ts
      - run: node infra/migration/native-engine-parity.mjs
      - run: node infra/migration/native-scraper-parity.mjs
      - run: node infra/migration/native-source-parity.mjs
      - run: node infra/migration/native-report-parity.mjs
      - name: Install pinned disposable PostgreSQL fixture
        run: npm install --prefix .qa-artifacts/canonical-fixture --no-save --package-lock=false @electric-sql/pglite@0.5.10
      - run: node infra/migration/canonical-financial-fixture.mjs
      - run: node infra/migration/investment-evidence-fixture.mjs
      - run: node infra/migration/institutional-fixture.mjs
      - run: node infra/security/session-assurance-fixture.mjs
      - run: node infra/migration/native-bundle-parity.mjs
      - run: node infra/migration/native-valuation-parity.mjs
      - run: node infra/migration/native-statistics-parity.mjs
      - run: node infra/migration/native-execution-parity.mjs
      - run: node infra/migration/native-notebook-parity.mjs
      - run: node infra/migration/native-advanced-parity.mjs
      - run: node infra/migration/native-risk-lab-parity.mjs
      - run: node infra/migration/native-feed-parity.mjs
      - run: node infra/migration/native-answer-parity.mjs
